{% extends "base.html" %}
{% block title %}Sign Up - Karnataka Biosecurity Network{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="page-kicker">Join the field network</div>
                        <h2 class="fw-bold mb-0"><i class="fas fa-user-plus text-success me-2"></i>Create Account</h2>
                    </div>
                    <form method="POST" id="signupForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username *</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password *</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="9876543210">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Role *</label>
                                <select name="role" class="form-select" id="roleSelect" required onchange="toggleFields()">
                                    <option value="">Select Role</option>
                                    <option value="farmer">Farmer</option>
                                    <option value="vet">Veterinarian</option>
                                    <option value="district_head">District Head</option>
                                    <option value="state_head">State Head</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Language</label>
                                <select name="language" class="form-select">
                                    <option value="en">English</option>
                                    <option value="kn">Kannada</option>
                                </select>
                            </div>
                        </div>

                        <div id="farmerFields" class="role-fields" style="display:none;">
                            <hr>
                            <h5>Farm Details</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Farm Name</label>
                                    <input type="text" name="farm_name" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">District *</label>
                                    <select name="district_id" class="form-select">
                                        {% for d in districts %}
                                        <option value="{{ d.id }}">{{ d.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Village</label>
                                    <input type="text" name="village" class="form-control">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Taluka</label>
                                    <input type="text" name="taluka" class="form-control">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Farm Size (acres)</label>
                                    <input type="number" step="0.1" name="farm_size" class="form-control">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Livestock Type</label>
                                    <select name="livestock_type" class="form-select">
                                        <option value="poultry">Poultry</option>
                                        <option value="pig">Pig</option>
                                        <option value="cattle">Cattle</option>
                                        <option value="goat">Goat</option>
                                        <option value="mixed">Mixed</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Animal Count</label>
                                    <input type="number" name="animal_count" class="form-control">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="0.0001" name="latitude" id="lat-field" class="form-control" placeholder="12.9716">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="0.0001" name="longitude" id="lng-field" class="form-control" placeholder="77.5946">
                                </div>
                            </div>
                            <div class="mb-3">
                                <button type="button" class="btn btn-outline-primary btn-sm w-100" onclick="getLocation()">
                                    <i class="fas fa-map-marker-alt me-2"></i>Use My Current Location for Farm GPS
                                </button>
                                <div id="location-status" class="small text-muted mt-1 text-center"></div>
                            </div>
                        </div>

                        <div id="vetFields" class="role-fields" style="display:none;">
                            <hr>
                            <h5>Veterinary Details</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Registration Number *</label>
                                    <input type="text" name="registration_number" class="form-control" placeholder="KA-VET-XXXX-2024">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Qualification</label>
                                    <input type="text" name="qualification" class="form-control" placeholder="BVSc & AH">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Specialization</label>
                                    <select name="specialization" class="form-select">
                                        <option value="Poultry">Poultry</option>
                                        <option value="Swine">Swine</option>
                                        <option value="Cattle">Cattle</option>
                                        <option value="Mixed Practice">Mixed Practice</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">District *</label>
                                    <select name="district_id" class="form-select">
                                        {% for d in districts %}
                                        <option value="{{ d.id }}">{{ d.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Taluka</label>
                                <input type="text" name="taluka" class="form-control">
                            </div>
                        </div>

                        <div id="districtHeadFields" class="role-fields" style="display:none;">
                            <hr>
                            <h5>District Details</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">District *</label>
                                    <select name="district_id" class="form-select">
                                        {% for d in districts %}
                                        <option value="{{ d.id }}">{{ d.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Office Phone</label>
                                    <input type="text" name="phone_office" class="form-control">
                                </div>
                            </div>
                        </div>

                        <div id="stateHeadFields" class="role-fields" style="display:none;">
                            <hr>
                            <h5>State Details</h5>
                            <div class="mb-3">
                                <label class="form-label">Office Phone</label>
                                <input type="text" name="phone_office" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-3">Create Account</button>
                    </form>
                    <p class="text-center mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleFields() {
    const role = document.getElementById('roleSelect').value;
    document.querySelectorAll('.role-fields').forEach(el => el.style.display = 'none');
    if (role === 'farmer') document.getElementById('farmerFields').style.display = 'block';
    if (role === 'vet') document.getElementById('vetFields').style.display = 'block';
    if (role === 'district_head') document.getElementById('districtHeadFields').style.display = 'block';
    if (role === 'state_head') document.getElementById('stateHeadFields').style.display = 'block';
}

function getLocation() {
    const status = document.getElementById('location-status');
    const latField = document.getElementById('lat-field');
    const lngField = document.getElementById('lng-field');

    if (!navigator.geolocation) {
        status.innerHTML = "<span class='text-danger'>Geolocation is not supported by your browser.</span>";
        return;
    }

    // Check for secure context (HTTPS or localhost)
    if (!window.isSecureContext) {
        status.innerHTML = "<span class='text-warning'><i class='fas fa-lock me-1'></i>Requires HTTPS or 'localhost'</span>";
        return;
    }

    status.innerHTML = "<span class='text-primary'><i class='fas fa-spinner fa-spin me-2'></i>Acquiring GPS location...</span>";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            latField.value = lat.toFixed(4);
            lngField.value = lng.toFixed(4);
            status.innerHTML = `<span class='text-success'><i class='fas fa-check-circle me-1'></i>Location captured successfully!</span>`;
        },
        (error) => {
            let errorMsg = "Unable to retrieve your location.";
            if (error.code === 1) errorMsg = "Location access denied. Please enable GPS.";
            status.innerHTML = `<span class='text-warning'>${errorMsg}</span>`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}
</script>
{% endblock %}
